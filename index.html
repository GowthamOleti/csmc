<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Cosmic Vista - Explore NASA's Astronomy Picture of the Day with a futuristic, dark mode interface." />
  <title>Cosmic Vista - APOD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Nebula Font CDN for headings -->
  <link href="https://fonts.cdnfonts.com/css/nebula" rel="stylesheet">
  <style>
    /* Futuristic animated gradient background */
    body {
      background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
      background-size: 600% 600%;
      animation: gradientAnimation 16s ease infinite;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Header with neon glow and futuristic styling */
    header {
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 1.5rem 0;
    }
    header h1 {
      font-family: 'Nebula', sans-serif;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
      letter-spacing: 2px;
      text-align: center;
      margin: 0;
      font-size: 2.5rem;
    }
    /* Futuristic glassmorphism card */
    .glass-card {
      background: rgba(20, 20, 20, 0.6);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 40px rgba(0, 255, 255, 0.4);
    }
    /* Neon button styling */
    .btn {
      transition: background-color 0.3s ease, transform 0.3s ease;
      box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    /* Input styling with neon focus */
    input[type="date"] {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
      border-radius: 0.5rem;
      padding: 0.5rem;
      transition: border-color 0.3s ease;
    }
    input[type="date"]:focus {
      border-color: #00ffff;
      outline: none;
    }
    /* Image styling with neon border on hover */
    img {
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      border-radius: 15px;
      border: 2px solid transparent;
    }
    img:hover {
      transform: scale(1.02);
      box-shadow: 0 0 10px #00ffff;
    }
    /* Loader text neon styling */
    #loader {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="max-w-5xl mx-auto px-4">
      <h1>Cosmic Vista</h1>
    </div>
  </header>

  <!-- Intro Description -->
  <section class="max-w-5xl mx-auto px-4 py-6">
    <p class="text-center text-lg">
      Welcome to Cosmic Vista! Dive into NASA's Astronomy Picture of the Day and explore the cosmos with stunning visuals and futuristic insights.
    </p>
  </section>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <section id="apod-section" class="mb-12">
      <div class="flex flex-col items-center">
        <h2 class="text-2xl mb-4">Astronomy Picture of the Day</h2>
        <div class="mb-6 flex items-center space-x-4">
          <input type="date" id="apod-date" class="focus:outline-none focus:ring-2 focus:ring-cyan-400" max="">
          <button id="fetch-btn" class="btn bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400">
            Fetch
          </button>
        </div>
        <div id="apod-content" class="w-full">
          <div id="loader" class="text-center text-xl">Loading...</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-gray-400">
    <p>Powered by NASA API</p>
  </footer>

  <!-- JavaScript -->
  <script>
    (function() {
      const apiKey = 'PvACm1rSexuV41x2BoklDw7PnrXCvzjfVNrn36mD';
      const apodContent = document.getElementById('apod-content');
      const dateInput = document.getElementById('apod-date');
      const fetchBtn = document.getElementById('fetch-btn');
      const today = new Date().toISOString().split('T')[0];

      // Set default and max date
      dateInput.max = today;
      dateInput.value = today;

      async function fetchAPOD(date = today) {
        apodContent.innerHTML = '<div id="loader" class="text-center text-xl">Loading...</div>';
        try {
          const response = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}&date=${date}`);
          if (!response.ok) throw new Error('Network response was not OK');
          const data = await response.json();
          displayAPOD(data);
        } catch (error) {
          console.error('Error fetching APOD:', error);
          apodContent.innerHTML = '<p class="text-center text-red-500">Failed to load data. Please try again later.</p>';
        }
      }

      function displayAPOD(data) {
        let mediaContent = '';
        if (data.media_type === 'image') {
          mediaContent = `<img src="${data.url}" alt="${data.title}" class="w-full">`;
        } else if (data.media_type === 'video') {
          mediaContent = `
            <div class="w-full aspect-video overflow-hidden">
              <iframe src="${data.url}" frameborder="0" allow="encrypted-media" allowfullscreen class="w-full h-full"></iframe>
            </div>
          `;
        }

        apodContent.innerHTML = `
          <div class="glass-card">
            <h3 class="text-xl mb-2 font-semibold">${data.title}</h3>
            ${mediaContent}
            <p class="mt-4 text-justify">${data.explanation}</p>
            <p class="mt-2 italic">Date: ${data.date}</p>
          </div>
        `;
      }

      // Initial fetch on load
      fetchAPOD();

      // Fetch when button is clicked
      fetchBtn.addEventListener('click', () => fetchAPOD(dateInput.value));
    })();
  </script>
</body>
</html>
