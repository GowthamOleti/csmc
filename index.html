<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Cosmic Vista - Explore NASA's Astronomy Picture of the Day with a futuristic, space-themed interface." />
  <title>Cosmic Vista - APOD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Nebula Font CDN for headings -->
  <link href="https://fonts.cdnfonts.com/css/nebula" rel="stylesheet">
  <style>
    /* Space-themed background */
    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      font-family: "SF Pro Display Medium", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Headings in Nebula font */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Nebula', sans-serif;
    }
    /* Smooth hover effect for images */
    img {
      transition: transform 0.3s ease-in-out;
    }
    img:hover {
      transform: scale(1.02);
    }
    /* Card styling for APOD content */
    .apod-card {
      background: rgba(0, 0, 0, 0.5);
      padding: 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="text-white">
  <!-- Header -->
  <header class="py-6 border-b border-gray-700">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
      <h1 class="text-3xl font-bold">Cosmic Vista</h1>
      <nav aria-label="Main Navigation">
        <!-- Future navigation items -->
      </nav>
    </div>
  </header>

  <!-- Intro Description -->
  <section class="max-w-5xl mx-auto px-4 py-4">
    <p class="text-center text-lg text-gray-300">
      Welcome to Cosmic Vista! Dive into NASA's Astronomy Picture of the Day and explore the cosmos with stunning visuals and captivating insights. Enjoy a futuristic, space-themed experience every day.
    </p>
  </section>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    <section id="apod-section" class="mb-12">
      <div class="flex flex-col items-center">
        <h2 class="text-2xl mb-4">Astronomy Picture of the Day</h2>
        <div class="mb-6 flex items-center">
          <input type="date" id="apod-date" class="rounded-lg p-2 text-black" max="">
          <button id="fetch-btn" class="ml-2 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
            Fetch
          </button>
        </div>
        <div id="apod-content" class="w-full">
          <div id="loader" class="text-center text-xl">Loading...</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-gray-400">
    <p>Powered by NASA API</p>
  </footer>

  <!-- JavaScript -->
  <script>
    (function() {
      const apiKey = 'PvACm1rSexuV41x2BoklDw7PnrXCvzjfVNrn36mD';
      const apodContent = document.getElementById('apod-content');
      const dateInput = document.getElementById('apod-date');
      const fetchBtn = document.getElementById('fetch-btn');
      const today = new Date().toISOString().split('T')[0];

      // Set default and max date
      dateInput.max = today;
      dateInput.value = today;

      async function fetchAPOD(date = today) {
        apodContent.innerHTML = '<div id="loader" class="text-center text-xl">Loading...</div>';
        try {
          const response = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}&date=${date}`);
          if (!response.ok) throw new Error('Network response was not OK');
          const data = await response.json();
          displayAPOD(data);
        } catch (error) {
          console.error('Error fetching APOD:', error);
          apodContent.innerHTML = '<p class="text-center text-red-500">Failed to load data. Please try again later.</p>';
        }
      }

      function displayAPOD(data) {
        let mediaContent = '';
        if (data.media_type === 'image') {
          mediaContent = `<img src="${data.url}" alt="${data.title}" class="w-full rounded-lg shadow-lg">`;
        } else if (data.media_type === 'video') {
          mediaContent = `
            <div class="w-full aspect-video rounded-lg overflow-hidden shadow-lg">
              <iframe src="${data.url}" frameborder="0" allow="encrypted-media" allowfullscreen class="w-full h-full"></iframe>
            </div>
          `;
        }

        apodContent.innerHTML = `
          <div class="apod-card">
            <h3 class="text-xl mt-4 mb-2 font-semibold">${data.title}</h3>
            ${mediaContent}
            <p class="mt-4 text-justify">${data.explanation}</p>
            <p class="mt-2 italic">Date: ${data.date}</p>
          </div>
        `;
      }

      // Initial fetch on load
      fetchAPOD();

      // Fetch when button is clicked
      fetchBtn.addEventListener('click', () => fetchAPOD(dateInput.value));
    })();
  </script>
</body>
</html>
